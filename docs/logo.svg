<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Light Pills Card</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4964"/>
      <stop offset="0.45" stop-color="#2a3854"/>
      <stop offset="0.75" stop-color="#1a2740"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fd"/>
      <stop offset="1" stop-color="#e6ecf6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd78a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1222" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0b1222" flood-opacity="0.16"/>
    </filter>
  </defs>
  <g transform="translate(1.13 9.32) scale(0.9636) translate(9.83 30.54) scale(0.9202)">
  <!-- Light rays -->
  <g stroke="url(#amber)" stroke-width="15" stroke-linecap="round" fill="none">
    <line x1="69.3" y1="114.8" x2="30.8" y2="103.8"/>
    <line x1="94.9" y1="74.6" x2="68.6" y2="44.4"/>
    <line x1="138.3" y1="54.8" x2="132.7" y2="15.2"/>
  </g>

  <!-- Card panel -->
  <rect x="112" y="70" width="350" height="400" rx="50"
        fill="url(#screen)" stroke="#1d2742" stroke-width="14" filter="url(#soft)"/>
  <rect x="146" y="100" width="104" height="14" rx="7" fill="#1d2742" opacity="0.85"/>
  <rect x="146" y="122" width="64" height="10" rx="5" fill="#1d2742" opacity="0.3"/>

  <!-- Collapsed pills -->
  <rect x="330" y="384" width="58" height="58" rx="17" fill="#4b5975"/>
  <path d="M12.5 7C12.5 5.89 13.39 5 14.5 5H18C19.1 5 20 5.9 20 7V9.16C18.84 9.57 18 10.67 18 11.97V14H12.5V7M6 11.96V14H11.5V7C11.5 5.89 10.61 5 9.5 5H6C4.9 5 4 5.9 4 7V9.15C5.16 9.56 6 10.67 6 11.96M20.66 10.03C19.68 10.19 19 11.12 19 12.12V15H5V12C5 10.9 4.11 10 3 10S1 10.9 1 12V17C1 18.1 1.9 19 3 19V21H5V19H19V21H21V19C22.1 19 23 18.1 23 17V12C23 10.79 21.91 9.82 20.66 10.03Z" fill="#e8edf6" opacity="0.8" transform="translate(342.00 396.00) scale(1.4167)"/>
  <rect x="394" y="384" width="58" height="58" rx="17" fill="#4b5975"/>
  <path d="M8,2H16L20,14H4L8,2M11,15H13V20H18V22H6V20H11V15Z" fill="#e8edf6" opacity="0.8" transform="translate(406.00 396.00) scale(1.4167)"/>

  <!-- Expanded pill, glowing and overflowing the panel -->
  <ellipse cx="407.0" cy="146.0" rx="150" ry="92" fill="url(#glow)"/>
  <rect x="292" y="104" width="214" height="84" rx="42.0"
        fill="url(#amber)" filter="url(#soft)"/>
  <path d="M12,2A7,7 0 0,0 5,9C5,11.38 6.19,13.47 8,14.74V17A1,1 0 0,0 9,18H15A1,1 0 0,0 16,17V14.74C17.81,13.47 19,11.38 19,9A7,7 0 0,0 12,2M9,21A1,1 0 0,0 10,22H14A1,1 0 0,0 15,21V20H9V21Z" fill="#1d2742" opacity="1.0" transform="translate(314.00 122.00) scale(2.0000)"/>
  <rect x="372" y="138.0" width="104" height="16" rx="8" fill="#1d2742"/>

  <!-- SW tile -->
  <g filter="url(#shadow)">
    <rect x="62" y="176" width="260" height="260" rx="56" fill="url(#tile)"/>
  </g>
